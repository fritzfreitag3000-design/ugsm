// ==============================================================================
// DayZ Dedicated Server Configuration (Erweiterte Bohemia-Vorlage)
// ==============================================================================

// --- Server-Identifikation & Zugang ---
hostname = " DayZ Server | Community & Survival"; // Name in der Serverliste
password = "";                                         // Passwort zum Beitreten (leer = öffentlich)
passwordAdmin = "123";        // Admin-Passwort für RCON / Spielleiter
enableWhitelist = 0;                                    // Whitelist aktivieren (0 = aus, 1 = nutzt whitelist.txt)
disableBanlist = 0;                                     // Banliste laden (0 = ban.txt aktiv, 1 = ignoriert)

// --- Spieleranzahl & Warteschlange ---
maxPlayers = 60;                        // Maximale gleichzeitig verbundene Spieler
loginQueueConcurrentUsers = 5;          // Anzahl der Spieler, die zeitgleich laden dürfen
loginQueueMaxPlayers = 500;             // Maximale Warteschlangen-Kapazität

// --- Sicherheit & Integrität ---
verifySignatures = 2;                   // Mod-Signaturprüfung (2 = v2 Signaturen erzwingen [Empfohlen])
forceSameBuild = 1;                     // Erfordert exakt dieselbe Spielversion zwischen Client und Server

// --- Voice & Kommunikation ---
disableVoip = 0;                        // In-Game Voice-Chat (0 = aktiviert, 1 = deaktiviert)
voipHeaderSamplingRate = 24000;         // Audio-Samplerate für Sprachchat (default: 24000)

// --- Gameplay & Perspektive ---
disable3rdPerson = 0;                   // Third-Person-Ansicht (0 = 1st & 3rd Person, 1 = nur 1st Person)
disableCrosshair = 0;                   // Fadenkreuz (0 = aktiviert, 1 = deaktiviert)
disablePersonalLight = 1;               // Persönliche Scheinwerfer-Lichtquelle um Spieler bei Nacht (0 = an, 1 = aus)
lightingConfig = 1;                     // Nachtbeleuchtung (0 = helle Nacht, 1 = dunkle/realistische Nacht)

// --- Zeit & Wetter-Einstellungen ---
serverTime = "SystemTime";              // Startzeit ("SystemTime" oder Format "YYYY/MM/DD/HH/MM")
serverTimeAcceleration = 4;             // Beschleunigung des Tages (1 = Echtzeit, 4 = 4x schneller)
serverNightTimeAcceleration = 8;        // Zusätzliche Beschleunigung für die Nacht
serverTimePersistent = 1;               // Speichert die Uhrzeit bei Server-Neustart (1 = aktiv)

// --- Netzwerkeinstellungen & Ping-Limits ---
steamQueryPort = 27016;                 // Port für Steam-Server-Browser / DZSA Launcher
guaranteedUpdates = 1;                  // Garantierte Paketübertragung (MUSS 1 sein)
steamProtocolMaxDataSize = 1024;        // Maximale Paketgröße für Steam-Protokoll
multihome = "";                         // Spezifische IP-Bindung (leer lassen für alle Schnittstellen)

pingWarning = 150;                      // Ping-Schwelle für Warnmeldung (in ms)
pingDisconnect = 300;                   // Maximal erlaubter Ping vor Kick (in ms)
pingCheckInterval = 20;                 // Prüfintervall für Spieler-Ping (in Sekunden)

// --- Datenbank & Storage ---
instanceId = 1;                         // Eindeutige Server-Instanz (steuert Ordner 'storage_1')
storageAutoFix = 1;                     // Repariert beschädigte Speicherdaten beim Start automatisch (1 = aktiv)

// --- Server-Performance & Log-Level ---
logAverageFps = 10;                     // Intervall (Sek.) für Server-FPS in der Konsole
logMemory = 10;                         // Intervall (Sek.) für RAM-Nutzung
logPlayers = 10;                        // Intervall (Sek.) für Spielerprotokollierung
logFile = "server_console.log";         // Log-Dateiname

// --- Detaillierte Admin- & Combat-Logs ---
adminLogPlayerHitsOnly = 1;             // Loggt nur Treffer auf Spieler (0 = alle Treffer loggen)
adminLogPlacement = 1;                  // Loggt Platzieren von Zelten/Zäunen/Strukturen (1 = an)
adminLogBuildActions = 1;               // Loggt Bau- und Abrissaktionen (1 = an)
adminLogPlayerList = 1;                 // Schreiben regelmäßiger Spielerlisten ins Log (1 = an)

// --- Map- & Missionsauswahl ---
class Missions
{
    class DayZ
    {
        template = "dayzOffline.chernarusplus"; // Kartenauswahl (chernarusplus, enoch, sakhal)
    };
};