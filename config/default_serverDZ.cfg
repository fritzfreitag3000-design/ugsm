// ==============================================================================
// DayZ Dedicated Server Configuration (extended Bohemia template)
// ==============================================================================

// --- Server name and access ---
hostname = " DayZ Server | Community & Survival"; // Name shown in the server list
password = "";                                         // Join password (empty means public)
passwordAdmin = "123";        // Admin password for server control
enableWhitelist = 0;                                    // Use whitelist.txt (0 = off, 1 = on)
disableBanlist = 0;                                     // Use ban.txt (0 = on, 1 = off)

// --- Player limit and queue ---
maxPlayers = 60;                        // Maximum number of players online at once
loginQueueConcurrentUsers = 5;          // Players allowed to load at the same time
loginQueueMaxPlayers = 500;             // Maximum number of players in the queue

// --- Security and version checks ---
verifySignatures = 2;                   // Check mod signatures (2 = require version 2 signatures)
forceSameBuild = 1;                     // Require clients and server to use the same game version

// --- Voice chat ---
disableVoip = 0;                        // In-game voice chat (0 = on, 1 = off)
voipHeaderSamplingRate = 24000;         // Voice chat audio rate (default: 24000)

// --- Gameplay and view ---
disable3rdPerson = 0;                   // Third-person view (0 = on, 1 = first-person only)
disableCrosshair = 0;                  // Crosshair (0 = on, 1 = off)
disablePersonalLight = 1;               // Personal light around players at night (0 = on, 1 = off)
lightingConfig = 1;                     // Night lighting (0 = brighter, 1 = darker)

// --- Time and weather ---
serverTime = "SystemTime";              // Start time ("SystemTime" or "YYYY/MM/DD/HH/MM")
serverTimeAcceleration = 4;             // Day speed (1 = real time, 4 = four times faster)
serverNightTimeAcceleration = 8;        // Extra speed for the night
serverTimePersistent = 1;               // Keep the time after a server restart (1 = on)

pingWarning = 150;                      // Show a warning above this ping (milliseconds)
pingDisconnect = 300;                   // Kick players above this ping (milliseconds)
pingCheckInterval = 20;                 // Ping check interval (seconds)

// --- Server data ---
instanceId = 1;                         // Unique server ID (uses the storage_1 folder)
storageAutoFix = 1;                     // Repair damaged saved data at startup (1 = on)

// --- Performance and logs ---
logAverageFps = 10;                     // Seconds between server FPS log entries
logMemory = 10;                         // Seconds between memory log entries
logPlayers = 10;                        // Seconds between player log entries
logFile = "server_console.log";         // Log file name

// --- Admin and combat logs ---
adminLogPlayerHitsOnly = 1;             // Log hits on players only (0 = log all hits)
adminLogPlacement = 1;                  // Log when players place items or structures (1 = on)
adminLogBuildActions = 1;               // Log building and dismantling (1 = on)
adminLogPlayerList = 1;                 // Regularly write player lists to the log (1 = on)

// --- Map and mission ---
class Missions
{
    class DayZ
    {
        template = "dayzOffline.chernarusplus"; // Map name (chernarusplus, enoch, or sakhal)
    };
};