# Workshop IDs of server-side mods that clients do not need (started with -servermod).
# One ID per line. Lines starting with "#" are ignored.
# Mods removed from this list are uninstalled (link and keys) the next time mods.sh runs.
#
# Examples (remove the "#" to enable):
# 2545327648 # Dabs Framework
# 1623711988 # VPPAdminTools
