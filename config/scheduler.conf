# Restart times for the DayZ server (used by scripts/scheduler.sh).
# Space-separated list of times in 24h format HH:MM (server local time).
# Default: a restart every three hours.
RESTART_TIMES="00:00 03:00 06:00 09:00 12:00 15:00 18:00 21:00"

# Maintenance times in 24h format HH:MM (space-separated).
# At these times the server is stopped, the MAINTENANCE_COMMAND lines below are
# run top to bottom (each in its own bash), and the server is started again.
# A maintenance time takes precedence over a restart time at the same minute.
MAINTENANCE_TIMES="05:00"

# Start the server again after the commands: 1 = yes, 0 = stay stopped.
# Set to 0 if a command reboots the machine.
# No restart after reboot
MAINTENANCE_START_SERVER=1

# One command per line; repeat the key for more commands. Comment a line out
# with # to disable it. The scheduler runs as the server user, so use sudo
# for privileged commands (needs passwordless sudo).
#MAINTENANCE_COMMAND="sudo apt-get update && sudo apt-get -y upgrade"
#MAINTENANCE_COMMAND="sudo reboot"
MAINTENANCE_COMMAND="echo 'Maintenance started'"


# Automatically recover the server after a crash: 1 = enabled, 0 = disabled.
AUTO_RECOVER=0

