# Start parameters for the DayZ server (used by scripts/start.sh).
# IP, ports and mods are NOT set here: they come from <servername>_server.conf,
# mods.conf and servermod.conf.
# Use 1 to enable a switch and 0 (or empty) to disable it.

# Server configuration file inside serverdata.
CONFIG_FILE="serverDZ.cfg"

# Profile folder (logs, mission data) inside serverdata.
PROFILES="profiles"

# BattlEye folder inside serverdata.
BEPATH="battleye"

# Write script and RPT logs to the profile folder.
DOLOGS=1

# Write the admin log.
ADMINLOG=1

# Write the network log.
NETLOG=1

# Restart-friendly freeze detection: the server stops itself when it freezes.
FREEZECHECK=1

# Number of CPU cores the server may use. Leave empty for automatic.
CPUCOUNT="4"

# Maximum server FPS. Leave empty for the default.
LIMITFPS="300"

# Additional raw parameters, separated by spaces. Example: "-noFilePatching"
EXTRA_PARAMS=""

# Case-insensitive extended regex searched for in the server console and RPT log.
HIVE_PATTERN="\[CE\]\[Hive\] :: Init sequence finished"
