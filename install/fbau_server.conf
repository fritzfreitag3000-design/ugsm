# Installation settings
# The installer shows each value as the default. Press Enter to keep it.

# Server state: stop, starting, running, stopping, or error.
STATE="stop"

# Server IP address to bind to.
# 127.0.0.1 allows local connections only.
# 0.0.0.0 listens on all network interfaces.
SERVER_IP="127.0.0.1"

# Linux user that will run the DayZ server. Leave empty to enter it during setup.
NEW_USER="dayz"

# Name of the server folder. Leave empty to enter it during setup.
SERVER_NAME="fbau"

# SteamCMD account name. Leave empty or set "anonymous" to let SteamCMD prompt for credentials.
STEAM_USER="dasg3000"

# DayZ game port (UDP). Add 2 for the next server on the same machine.
# This port must be different from the other ports.
GAME_PORT=2302

# BattlEye RCON port (UDP). Add 2 for the next server on the same machine.
# This port must be different from the other ports.
RCON_PORT=2303

# Steam server query port (UDP). Add 1 for the next server on the same machine.
# This port must be different from the other ports.
STEAM_QUERY_PORT=27016

# BattlEye RCON password. This value is stored as plain text in this file.
# Keep this file private and do not commit it.
RCON_PASS="123"

# DayZ server admin password. This value is stored as plain text in this file.
ADMIN_PASS="stongpw"

# Seconds start.sh waits for the Hive to initialize. The ports stay blocked if the time runs out.
STARTUP_TIMEOUT=300

# Seconds start.sh waits after the Hive is initialized before it opens the ports. 0 opens them immediately.
PORT_OPEN_DELAY=20

# Seconds stop.sh waits for the server to stop after #shutdown before it sends Ctrl+C.
SHUTDOWN_TIMEOUT=120

# Seconds stop.sh waits for the server to stop after Ctrl+C before it kills the process.
SIGINT_TIMEOUT=60

# Scheduler state (managed by scheduler.sh): 1 = active, 0 = inactive.
SCHEDULER_STATE=0
